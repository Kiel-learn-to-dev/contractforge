[workspace]
resolver = "3"
members = ["crates/*", "spikes/ui-spike"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
rust_decimal = { version = "1.43", features = ["serde-with-str"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
regex = "1.13"
unicode-normalization = "0.1.26"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0"
zip = { version = "9.8", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
rusqlite = { version = "0.43", features = ["bundled"] }
calamine = { version = "0.38", features = ["chrono"] }
rust_xlsxwriter = "0.104"
sha2 = "0.11"
uuid = { version = "1.29", features = ["v4"] }
fs4 = "1.1"
slint = { version = "1.19.1", default-features = false, features = ["compat-1-2", "std", "backend-winit", "renderer-femtovg", "accessibility"] }
slint-build = "1.19.1"
rfd = "0.18"
open = "5.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
anyhow = "1.0"
tempfile = "3.27"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
